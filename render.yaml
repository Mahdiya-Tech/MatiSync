services:
  # MatiSync Unified Production Web Service on Render
  - type: web
    name: matisync
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python start.py
    plan: free
    region: oregon
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEPLOYMENT_MODE
        value: rollout
      - key: ACTIVE_SECTOR
        value: oil_and_gas
      - key: PYTHON_VERSION
        value: 3.12.0
